# Render Blueprint — 판독문 추적관찰 도구 (V1 정적 사이트 + V2 웹 서비스)
# 저장소 루트에 위치. Blueprint 연결 시 두 서비스가 함께 생성됩니다.
services:
  # V1: 서버리스 정적 웹앱 (Static Site, 무료, 슬립 없음)
  - type: web
    name: pandokmun-followup-v1
    runtime: static
    buildCommand: cd v1-web-serverless && npm install && npm run build
    staticPublishPath: v1-web-serverless/dist

  # V2: Node 서버 + JSON 저장(다중 사용자 공유). 무료 웹 서비스.
  - type: web
    name: pandokmun-followup-v2
    runtime: node
    plan: free
    buildCommand: cd v2-server && npm install
    startCommand: cd v2-server && npm start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      # PORT는 Render가 자동 주입 → 서버가 process.env.PORT 사용
