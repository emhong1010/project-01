# Render Blueprint — v2-server 무료 웹 서비스 배포 설정
# 저장소 루트에 위치. rootDir을 루트로 두어 v2-server가 형제 폴더
# (shared-core, v1-web-serverless)를 상대경로로 참조할 수 있게 함.
services:
  - type: web
    name: pandokmun-followup-v2
    runtime: node
    plan: free
    # rootDir 미지정(=저장소 루트). 빌드/시작 시 v2-server 디렉터리로 진입.
    buildCommand: cd v2-server && npm install
    startCommand: cd v2-server && npm start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      # PORT는 Render가 자동 주입 → 서버가 process.env.PORT 사용
