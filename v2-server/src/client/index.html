<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판독문 추적관찰 도구 (V2)</title>
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <h1>판독문 추적 관찰 도구 <span class="badge-version">V2 · 서버 공유</span></h1>
        <p class="subtitle">
          진행 상태가 서버에 저장되어 여러 과 선생님이 함께 봅니다.
        </p>
        <div class="user-bar">
          <label>이름 <input id="user-name" data-testid="user-name" type="text" placeholder="예: 김민준" /></label>
          <label>진료과 <input id="user-dept" data-testid="user-dept" type="text" placeholder="예: 호흡기내과" /></label>
          <button id="user-enter" data-testid="user-enter">시작</button>
          <span id="user-current" class="user-current"></span>
        </div>
      </header>
      <section id="upload-section"></section>
      <section id="dashboard-section"></section>
      <section id="table-section"></section>
      <footer class="app-footer">
        규칙 기반 판별로 오탐/미탐이 있을 수 있습니다. 근거 문장을 함께 확인하세요.
      </footer>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
